<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704" role="img" aria-labelledby="title desc"><title id="title">One email. Five decisions. A useful place to work.</title><desc id="desc">Illustrative example: a customer asks for a revised quote. Jev returns Soon, Customer Sales, Reply, a 96 percent Needs owner score and a 3 percent security review score. Application rules file it in Customer Sales with Soon, Reply and Needs Me labels. Values are fictional, not a measured model result.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#087e82"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="704" rx="24" fill="#f5f8f5" stroke="none"/><text x="44" y="51" font-size="17" fill="#087e82" font-weight="700">JEV OUTLOOK ORGANIZER</text><text x="44" y="102" font-size="38" fill="#203339" font-weight="700">Turn email context into typed decisions.</text><text x="44" y="138" font-size="21" fill="#56696d" font-weight="400">TypeSafe Jev interprets the message. Your Worker applies the filing policy.</text><rect x="44" y="183" width="470" height="298" rx="16" fill="#e8efec" stroke="none"/><text x="72" y="220" font-size="15" fill="#087e82" font-weight="700">01  MESSAGE + YOUR CONTEXT</text><text x="72" y="264" font-size="26" fill="#203339" font-weight="700">Updated quote for the next order</text><text x="72" y="299" font-size="18" fill="#56696d" font-weight="400">From: buyer@customer.example</text><text x="72" y="344" font-size="23" fill="#203339" font-weight="400">“Could you send the revised pricing</text><text x="72" y="378" font-size="23" fill="#203339" font-weight="400">before we place our next order?”</text><text x="72" y="443" font-size="17" fill="#56696d" font-weight="400">Known customer · sales workflow</text><path d="M532 324 H571" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="595" y="183" width="641" height="298" rx="16" fill="#e2f0ee" stroke="none"/><text x="621" y="220" font-size="15" fill="#087e82" font-weight="700">02  ONE JEV REQUEST</text><text x="1103" y="220" font-size="13" fill="#56696d" font-weight="700">EXAMPLE</text><text x="621" y="264" font-size="21" fill="#203339" font-weight="700">Attention</text><text x="840" y="264" font-size="16" fill="#56696d" font-weight="400">Choice</text><text x="947" y="264" font-size="21" fill="#087e82" font-weight="700">Soon</text><path d="M621 278 H1209" stroke="#cadbd8"/><text x="621" y="307" font-size="21" fill="#203339" font-weight="700">Type</text><text x="840" y="307" font-size="16" fill="#56696d" font-weight="400">Choice</text><text x="947" y="307" font-size="21" fill="#087e82" font-weight="700">Customer Sales</text><path d="M621 321 H1209" stroke="#cadbd8"/><text x="621" y="350" font-size="21" fill="#203339" font-weight="700">Action</text><text x="840" y="350" font-size="16" fill="#56696d" font-weight="400">Choice</text><text x="947" y="350" font-size="21" fill="#087e82" font-weight="700">Reply</text><path d="M621 364 H1209" stroke="#cadbd8"/><text x="621" y="393" font-size="21" fill="#203339" font-weight="700">Needs owner</text><text x="840" y="393" font-size="16" fill="#56696d" font-weight="400">Noul</text><text x="947" y="393" font-size="21" fill="#087e82" font-weight="700">96%</text><path d="M621 407 H1209" stroke="#cadbd8"/><text x="621" y="436" font-size="21" fill="#203339" font-weight="700">Security risk</text><text x="840" y="436" font-size="16" fill="#56696d" font-weight="400">Noul</text><text x="947" y="436" font-size="21" fill="#087e82" font-weight="700">3%</text><rect x="44" y="510" width="1192" height="115" rx="16" fill="#203f43" stroke="none"/><text x="72" y="548" font-size="15" fill="#b4dcd4" font-weight="700">03  POLICY CHECKS PASS → OUTLOOK</text><text x="72" y="592" font-size="29" fill="#f1f7f3" font-weight="700">Inbox / Customer Sales</text><rect x="687" y="550" width="113" height="42" rx="21" fill="#f9ddb9" stroke="none"/><text x="705" y="578" font-size="19" fill="#784919" font-weight="700">Soon</text><rect x="814" y="550" width="116" height="42" rx="21" fill="#d5e3e4" stroke="none"/><text x="832" y="578" font-size="19" fill="#203339" font-weight="700">Reply</text><rect x="944" y="550" width="154" height="42" rx="21" fill="#f6c8c5" stroke="none"/><text x="962" y="578" font-size="19" fill="#883431" font-weight="700">Needs Me</text><text x="72" y="672" font-size="16" fill="#56696d" font-weight="400">Illustrative values; assumes eligible mail and clear Type confidence/probability. Unread status and flags are preserved.</text></g></svg>
