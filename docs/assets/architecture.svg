<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc"><title id="title">How the organizer works</title><desc id="desc">Architecture: a five-minute schedule and admin dashboard call a Cloudflare Worker and one mailbox coordinator. The coordinator reads email through Microsoft Graph, sends bounded context and five questions to TypeSafe Jev, validates results and applies policy. A guarded writer updates categories and folders through Graph. SQLite in the Durable Object stores jobs, budgets, audit metadata and optional correction history. No email content is stored in the ledger.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#087e82"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="930" rx="24" fill="#f5f8f5" stroke="none"/><text x="44" y="51" font-size="17" fill="#087e82" font-weight="700">ARCHITECTURE</text><text x="44" y="101" font-size="36" fill="#203339" font-weight="700">A decision model inside a durable workflow.</text><text x="44" y="140" font-size="21" fill="#56696d" font-weight="400">Your Microsoft 365 mailbox + your Cloudflare deployment + your TypeSafe key</text><rect x="44" y="185" width="322" height="156" rx="16" fill="#e8efec" stroke="none"/><text x="68" y="224" font-size="15" fill="#087e82" font-weight="700">MICROSOFT 365</text><text x="68" y="262" font-size="27" fill="#203339" font-weight="700">Microsoft Graph</text><text x="68" y="297" font-size="18" fill="#56696d" font-weight="400">Read eligible Inbox messages</text><rect x="420" y="185" width="396" height="156" rx="16" fill="#203f43" stroke="none"/><text x="444" y="224" font-size="15" fill="#b4dcd4" font-weight="700">YOUR CLOUDFLARE WORKER</text><text x="444" y="262" font-size="27" fill="#f1f7f3" font-weight="700">Mailbox coordinator</text><text x="444" y="297" font-size="18" fill="#d3e2df" font-weight="400">5-minute discovery · durable alarms</text><path d="M366 266 H418" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="246" font-size="13" fill="#56696d" font-weight="400">read</text><rect x="880" y="185" width="356" height="218" rx="16" fill="#e2f0ee" stroke="none"/><text x="904" y="224" font-size="15" fill="#087e82" font-weight="700">TYPESAFE API</text><text x="904" y="262" font-size="32" fill="#203339" font-weight="700">Jev</text><text x="904" y="298" font-size="19" fill="#56696d" font-weight="400">Bounded message + context</text><text x="904" y="326" font-size="19" fill="#56696d" font-weight="400">3 Choice + 2 Noul questions</text><text x="904" y="354" font-size="19" fill="#56696d" font-weight="400">Typed answers + uncertainty</text><path d="M816 266 H878" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="829" y="246" font-size="13" fill="#56696d" font-weight="400">state</text><rect x="44" y="424" width="322" height="188" rx="16" fill="#e8efec" stroke="none"/><text x="68" y="463" font-size="15" fill="#087e82" font-weight="700">OWNER DASHBOARD</text><text x="68" y="501" font-size="25" fill="#203339" font-weight="700">Review &amp; correct</text><text x="68" y="538" font-size="17" fill="#56696d" font-weight="400">Health · pause · previews</text><text x="68" y="566" font-size="17" fill="#56696d" font-weight="400">Apply correction · optional learning</text><path d="M366 468 H393 V320 H418" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="424" width="396" height="188" rx="16" fill="#edf0e2" stroke="none"/><text x="444" y="463" font-size="15" fill="#60732a" font-weight="700">SQLITE DURABLE OBJECT</text><text x="444" y="501" font-size="25" fill="#203339" font-weight="700">Metadata ledger</text><text x="444" y="538" font-size="18" fill="#56696d" font-weight="400">Jobs · budgets · intent / checkpoints</text><text x="444" y="566" font-size="18" fill="#56696d" font-weight="400">Audit · optional correction history</text><path d="M617 341 V421" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="880" y="458" width="356" height="190" rx="16" fill="#e2f0ee" stroke="none"/><text x="904" y="497" font-size="15" fill="#087e82" font-weight="700">APPLICATION CODE</text><text x="904" y="535" font-size="25" fill="#203339" font-weight="700">Validate &amp; route</text><text x="904" y="572" font-size="17" fill="#56696d" font-weight="400">Thresholds · scope · current state</text><text x="904" y="599" font-size="17" fill="#56696d" font-weight="400">Clear Type → matching folder</text><text x="904" y="626" font-size="17" fill="#56696d" font-weight="400">Uncertain Type → Inbox review</text><path d="M1058 403 V456" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1072" y="435" font-size="14" fill="#56696d" font-weight="400">answers</text><rect x="420" y="696" width="396" height="132" rx="16" fill="#203f43" stroke="none"/><text x="444" y="734" font-size="15" fill="#b4dcd4" font-weight="700">GUARDED GRAPH WRITES</text><text x="444" y="773" font-size="25" fill="#f1f7f3" font-weight="700">Categories + Type folder</text><text x="444" y="805" font-size="17" fill="#d3e2df" font-weight="400">Recheck state · preserve unread and flags</text><path d="M1058 648 V762 H818" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="879" y="741" font-size="15" fill="#56696d" font-weight="400">approved by policy</text><path d="M618 696 V614" fill="none" stroke="#087e82" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="629" y="665" font-size="15" fill="#56696d" font-weight="400">save intent / result</text><path d="M420 762 H22 V360 H205 V343" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="67" y="697" font-size="17" fill="#56696d" font-weight="400">Result stays in Outlook</text><text x="44" y="883" font-size="17" fill="#56696d" font-weight="400">Jev receives message context. The ledger retains decision and state metadata, not email bodies, subjects or addresses.</text></g></svg>
